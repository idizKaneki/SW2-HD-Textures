; Samurai Warriors 2 - HD Textures (SW2HD.asi)
; 1 = on / activé, 0 = off / désactivé

[Settings]
; Enable the HD textures / Activer les textures HD
Enable=1
; Write SW2HD.log (useful if something goes wrong) / Écrire SW2HD.log (utile en cas de problème)
Log=1
; Keep HD textures in video memory, not in the game's memory (recommended)
; Garder les textures HD en mémoire vidéo, hors de la mémoire du jeu (recommandé)
VideoMemory=1
; Smoother distant textures, less shimmering / Textures lointaines plus douces, moins de scintillement
Mipmaps=1
